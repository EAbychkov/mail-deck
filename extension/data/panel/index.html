<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mail Deck</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="app" id="app">
    <main class="main">
      <header class="bar">
        <div class="heading">
          <h1 data-i18n="inbox">Inbox</h1>
          <p class="sub" id="sub"></p>
        </div>
        <div class="tools" id="tools"></div>
      </header>
      <form class="search" id="search" role="search" hidden>
        <input id="search-input" type="search" autocomplete="off" spellcheck="false" enterkeyhint="search">
      </form>
      <nav class="chips" id="chips" aria-label="Mailboxes" data-i18n-label="mailboxes"></nav>
      <div class="list" id="list"></div>

      <section class="reader" id="reader" tabindex="-1" aria-label="Message" data-i18n-label="message">
        <header class="bar reader-bar" id="reader-bar"></header>
        <div class="reader-card">
        <div class="reader-head">
          <p class="reader-account" id="reader-account"><span class="dot"></span><span></span></p>
          <h2 id="reader-subject"></h2>
          <div class="reader-from">
            <span id="reader-avatar"></span>
            <div class="who">
              <span class="name" id="reader-name"></span>
              <span class="addr" id="reader-addr"></span>
            </div>
            <time id="reader-date"></time>
          </div>
        </div>
        <div class="reader-body">
          <div class="progress"></div>
          <iframe id="body" src="body/index.html" title="Message body" data-i18n-label="messageBody"></iframe>
        </div>
        <p class="keys"><span><kbd>R</kbd><span data-i18n="keyRead">read</span></span><span><kbd>E</kbd><span data-i18n="keyArchive">archive</span></span><span><kbd>Del</kbd><span data-i18n="keyDelete">delete</span></span><span><kbd>B</kbd><span data-i18n="keyRemind">later</span></span><span><kbd>S</kbd><span data-i18n="keyStar">star</span></span><span><kbd>J</kbd><span data-i18n="keyNext">next</span></span><span><kbd>K</kbd><span data-i18n="keyPrev">previous</span></span><span><kbd>Esc</kbd><span data-i18n="keyBack">back</span></span></p>
        </div>
      </section>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <!-- what the search found, said to a screen reader -->
  <p class="sr" id="status" role="status"></p>

  <script src="/core/services/yahoo.js"></script>
  <script src="/core/services/aol.js"></script>
  <script src="/core/services/proton.js"></script>
  <script src="/core/services/yandex.js"></script>
  <script src="/core/services/mailru.js"></script>
  <script src="/core/utils/resolved.js"></script>
  <script src="/core/utils/remind.js"></script>
  <script src="gmail.js"></script>
  <script src="index.js"></script>
</body>
</html>
