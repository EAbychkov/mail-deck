name: release

# A version that reaches main becomes a GitHub Release: the tag v<version> on that commit, the
# zip the store gets (tools/package.sh) and the notes of its section in CHANGELOG.md. A version
# already released is left alone, so any other push to main does nothing here.
on:
  push:
    branches: [main]
    paths:
      - extension/manifest.json
      - CHANGELOG.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Version and notes
        id: version
        run: |
          version=$(python3 -I -c 'import json; print(json.load(open("extension/manifest.json"))["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "v$version is released already"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # the lines under "## <version>", up to the next version's heading
          python3 -I - "$version" > notes.md <<'EOF'
          import re, sys
          version = sys.argv[1]
          text = open('CHANGELOG.md', encoding='utf-8').read()
          m = re.search(r'^## ' + re.escape(version) + r'\b[^\n]*\n(.*?)(?=^## |\Z)', text, re.M | re.S)
          if not m or not m.group(1).strip():
              sys.exit(f'CHANGELOG.md has no notes for {version}')
          print(m.group(1).strip())
          EOF
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Tests
        if: steps.version.outputs.skip != 'true'
        run: tools/test/run.sh
        env:
          CHROME: google-chrome
      - name: Release
        if: steps.version.outputs.skip != 'true'
        run: |
          zip=$(tools/package.sh)
          gh release create "v${{ steps.version.outputs.version }}" "$zip" \
            --target "$GITHUB_SHA" \
            --title "Mail Deck ${{ steps.version.outputs.version }}" \
            --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
