<!DOCTYPE html>
<!-- The panel at a width headless Chrome will not give a window (it keeps 500px at least):
     a narrow side panel is the panel in a frame that wide. ?w= is the width, ?q= the panel's query. -->
<html>
<head>
  <meta charset="utf-8">
  <title>panel frame</title>
</head>
<body style="margin: 0">
  <script>
    const p = new URLSearchParams(location.search);
    const f = document.createElement('iframe');
    f.style.cssText = `width: ${Number(p.get('w'))}px; height: 600px; border: 0`;
    f.src = '/__panel.html?' + p.get('q');
    document.body.append(f);
  </script>
</body>
</html>
