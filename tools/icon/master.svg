<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!--
    Mail Deck · master artwork (store 128, notification/options 48–64, landing).
    The deck, dealt: two inbox cards (orange, green) fan out down-right behind the envelope.
    Cards are 70×56, corner 13; the group is scaled to a 98 px box inside the 128 canvas
    (Chrome Web Store: ~96 px artwork, ~16 px transparent margin), the soft shadow stays inside it.
    Smaller outputs reuse this file with a tighter viewBox (see render.py).
  -->
  <defs>
    <linearGradient id="orange" x1="0" y1="0" x2=".35" y2="1">
      <stop offset="0" stop-color="#f7ae5c"/><stop offset=".5" stop-color="#e88a2e"/><stop offset="1" stop-color="#d1721a"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2=".35" y2="1">
      <stop offset="0" stop-color="#34cc8f"/><stop offset=".5" stop-color="#17a066"/><stop offset="1" stop-color="#0e8552"/>
    </linearGradient>
    <linearGradient id="indigo" x1="0" y1="0" x2=".35" y2="1">
      <stop offset="0" stop-color="#7380ff"/><stop offset=".55" stop-color="#4c5aec"/><stop offset="1" stop-color="#3843cc"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a0aaff"/><stop offset="1" stop-color="#7783fa"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".6"/><stop offset=".16" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <!-- each card casts a small shadow on the one behind it; light comes from the top left -->
    <filter id="cast" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="1.5" dy="2.5" stdDeviation="2.6" flood-color="#0b0d2e" flood-opacity=".32"/>
    </filter>
    <!-- soft shade under the flap, so it reads as folded paper -->
    <filter id="fold" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <!-- the whole mark's shadow on the page -->
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#0b0d2e" flood-opacity=".2"/>
    </filter>
    <path id="card" d="M13 0H57A13 13 0 0 1 70 13V43A13 13 0 0 1 57 56H13A13 13 0 0 1 0 43V13A13 13 0 0 1 13 0Z"/>
    <path id="rimline" d="M13 0.75H57A12.25 12.25 0 0 1 69.25 13V43A12.25 12.25 0 0 1 57 55.25H13A12.25 12.25 0 0 1 0.75 43V13A12.25 12.25 0 0 1 13 0.75Z" fill="none" stroke="url(#rim)" stroke-width="1.5"/>
    <clipPath id="front"><use href="#card"/></clipPath>
  </defs>
  <g filter="url(#drop)">
    <g transform="translate(15 16.94) scale(1.076)">
      <!-- back: orange inbox -->
      <g transform="translate(16 22) rotate(12 35 28)">
        <use href="#card" fill="url(#orange)"/>
        <use href="#rimline"/>
      </g>
      <!-- middle: green inbox -->
      <g transform="translate(8 11) rotate(6 35 28)">
        <use href="#card" fill="url(#green)" filter="url(#cast)"/>
        <use href="#rimline"/>
      </g>
      <!-- front: the envelope -->
      <use href="#card" fill="url(#indigo)" filter="url(#cast)"/>
      <g clip-path="url(#front)">
        <path d="M-6 -2L35 36.36L76 -2" fill="none" stroke="#0d1160" stroke-opacity=".5" stroke-width="6" filter="url(#fold)"/>
        <path d="M-4 -4H74V0L35 31.36L-4 0Z" fill="url(#flap)" stroke="url(#flap)" stroke-width="5" stroke-linejoin="round"/>
        <path d="M-3 .4L35 33.76L73 .4" fill="none" stroke="#fff" stroke-width="2.8" stroke-linejoin="round"/>
      </g>
      <use href="#rimline"/>
    </g>
  </g>
</svg>
